server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The live demo is its own app at demo.tracebi.com. /app and /api were its
    # paths when one host served both, so existing links redirect rather than
    # break.
    location = /app      { return 301 https://demo.tracebi.com/; }
    location ^~ /app/    { return 301 https://demo.tracebi.com/; }
    location ^~ /api/    { return 301 https://demo.tracebi.com$request_uri; }

    # /docs and /docs/concepts → their index.html, and clean URLs for pages.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Assets and the generated docs change only on deploy.
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
