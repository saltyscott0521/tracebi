server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The live demo is served at tracebi.com/app. It runs as its own container
    # (the repo Dockerfile, built with UI_BASE=/app/); this server passes /app
    # and /api through to it via Coolify's router, which knows it by the
    # internal hostname demo.tracebi.com. Resolved per request (resolver +
    # variable) so this container starts even if the demo is redeploying.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demo http://coolify-proxy:80;

    location = /app { return 301 /app/; }

    # /app/<path> → the demo's /<path>: the UI is built for /app, the server
    # itself is mounted at /.
    location ^~ /app/ {
        rewrite ^/app/(.*)$ /$1 break;
        proxy_pass $demo;
        proxy_set_header Host demo.tracebi.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # The UI calls /api/... on this host; pass it through unchanged.
    location ^~ /api/ {
        proxy_pass $demo;
        proxy_set_header Host demo.tracebi.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # /docs and /docs/concepts → their index.html, and clean URLs for pages.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Assets and the generated docs change only on deploy.
    location ~* ^/(assets|docs|sample)/.*\.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
