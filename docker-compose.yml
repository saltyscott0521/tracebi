# TraceBi — getting-started Docker Compose stack.
#
# It serves ONE project, examples/portfolio_project (the three-phase reference
# project, warehouse baked at image build), and nothing beside it. The bundled
# demo app is not served here: it is opt-in, with TRACEBI_APP=tracebi.web.demo_app
# on a plain `python -m tracebi.web.run`, and never runs beside a project.
#
# Three services, one per deployment plane (see NOTES.md, "Deployment planes"):
#
#   db     the state plane — Postgres. On its first start it creates a
#          standing mock CRM database, `crm`, loaded once from the reference
#          project's inputs/seed_crm.sql (docker/postgres-init.sql), and the
#          `tracebi_state` database for the run store. Both persist on the
#          `pgdata` volume.
#   seed   the execution plane — runs the reference project's pipelines once
#          (each model's transform, then its reports) into the shared
#          warehouse volume, so the portfolio transform reads the CRM, and
#          exits. It reads the CRM; it never writes it.
#   app    the serving plane — FastAPI + React on :8000, over the warehouse
#          `seed` just wrote. Starting a web process does no batch work.
#
# Quick start:
#
#     docker compose up --build
#     open http://localhost:8000
#
# Re-run a model's pipeline later without restarting the API: Refresh data on
# the model in the app, or
#
#     docker compose exec app tracebi run-pipeline portfolio_model
#
# Postgres is published on :5432 so the CRM can be inspected, and the
# execution plane driven, from the host.
#
# To require login, set TRACEBI_AUTH_USER and TRACEBI_AUTH_PASS in a
# local .env file or directly in the environment.

x-crm-url: &crm-url
  # The reference project's CRM (connections/crm.yaml reads it as
  # ${TRACEBI_CRM_URL}): its own database on this stack's Postgres. Local
  # development credentials, deliberately weak and not a secret: this database
  # is reachable only from this compose network and your own machine. Override
  # POSTGRES_PASSWORD for anything that outlives a laptop.
  TRACEBI_CRM_URL: postgresql+psycopg://tracebi:${POSTGRES_PASSWORD:-tracebi}@db:5432/crm

services:
  db:
    image: postgres:16-alpine
    container_name: tracebi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracebi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracebi}
      POSTGRES_DB: tracebi
    ports:
      # Published so the execution plane can be driven from the host. Anyone
      # already running Postgres locally has 5432 taken, so this is
      # overridable: POSTGRES_PORT=55432 docker compose up.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Run once, on the first start of an empty pgdata volume: creates the
      # crm and tracebi_state databases and loads the CRM's one table.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
      - ./examples/portfolio_project/inputs/seed_crm.sql:/seed/seed_crm.sql:ro
    healthcheck:
      # The seed service must not start against a Postgres that is still
      # initialising, or the transform's CRM read fails on connection refused.
      test: ["CMD-SHELL", "pg_isready -U tracebi -d tracebi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seed:
    build: .
    image: tracebi:local
    container_name: tracebi-seed
    depends_on:
      db:
        condition: service_healthy
      output-perms:
        condition: service_completed_successfully
    environment:
      <<: *crm-url
    # The image's WORKDIR is the reference project. Each model's pipeline
    # re-sinks its tables into the warehouse volume app reads (portfolio's
    # transform now from the CRM, not the snapshot the image was baked with)
    # and rebuilds its reports into output/.
    command:
      - sh
      - -c
      - >-
        tracebi run-pipeline portfolio_model
        && tracebi run-pipeline saas_model
        && tracebi run-pipeline housing_model
    volumes:
      - warehouse:/app/examples/portfolio_project/data
      - ./examples/portfolio_project/output:/app/examples/portfolio_project/output
    restart: "no"

  output-perms:
    build: .
    # One-shot: the host folder for report builds is usually owned by root
    # (or created by Docker as root), and the app runs as uid 10001. Without
    # this, no build can be saved and every visit to a report rebuilds it.
    image: tracebi:local
    user: "0:0"
    volumes:
      - ./examples/portfolio_project/output:/out
    command: ["chown", "-R", "10001:10001", "/out"]
    restart: "no"

  app:
    build: .
    image: tracebi:local
    container_name: tracebi
    restart: unless-stopped
    depends_on:
      output-perms:
        condition: service_completed_successfully
      # Wait for the data to exist rather than racing it — otherwise the first
      # page load can land on tables the seed is still rewriting.
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      <<: *crm-url
      # Optional HTTP basic auth — leave unset to keep the API open.
      TRACEBI_AUTH_USER: ${TRACEBI_AUTH_USER:-}
      TRACEBI_AUTH_PASS: ${TRACEBI_AUTH_PASS:-}
      # Reverse-proxy auth (Authelia / oauth2-proxy / Cloudflare Access).
      # When set, takes precedence over Basic auth.
      TRACEBI_AUTH_PROXY_HEADER: ${TRACEBI_AUTH_PROXY_HEADER:-}
      TRACEBI_AUTH_PROXY_TRUSTED_IPS: ${TRACEBI_AUTH_PROXY_TRUSTED_IPS:-}
      # Set to 1 to enable /api/_dev/reload for hot-reload during dev.
      TRACEBI_DEV_MODE: ${TRACEBI_DEV_MODE:-0}
      PORT: "8000"
    volumes:
      # The warehouse seed wrote (first created from the one baked into the
      # image); Refresh data in the app rewrites it in place.
      - warehouse:/app/examples/portfolio_project/data
      # Report builds and their traces land in a folder on the host, where
      # they can be browsed, backed up or shared. The app runs as uid 10001,
      # so output-perms (below) makes the folder writable by it first.
      - ./examples/portfolio_project/output:/app/examples/portfolio_project/output
      # Scheduled scripts are read from the host so they can be edited live.
      - ./examples/portfolio_project/scheduled:/app/examples/portfolio_project/scheduled
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  # The reference project's data/: the warehouse and its certificate. Docker
  # fills it from the image on first use; seed rewrites it on every up.
  warehouse:
