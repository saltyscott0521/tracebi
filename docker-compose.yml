# TraceBi — getting-started Docker Compose stack.
#
# Three services, one per deployment plane (see NOTES.md, "Deployment planes"):
#
#   db     the state plane — Postgres. Holds the medallion tables and the
#          pipeline's run history, so both survive restarts.
#   seed   the execution plane — runs the pipeline once and exits. This is the
#          only service that writes.
#   app    the serving plane — FastAPI + React on :8000. Reads. Because
#          TRACEBI_DEMO_DB_URL is set, importing the app module defines layers
#          without executing any, so starting a web process does no batch work.
#
# That separation is the point. Without a database there is nowhere for an
# execution plane to have written, so the demo falls back to seeding itself
# inside the web process at import — which is what the Vercel deployment does
# and what this stack exists to demonstrate the alternative to.
#
# Quick start:
#
#     docker compose up --build
#     open http://localhost:8000
#
# Re-run the pipeline later without restarting the API:
#
#     docker compose run --rm seed
#
# Postgres is published on :5432 so the execution plane can also be driven
# from the host — `tracebi run-pipeline`, a cron entry, a CI job — which is
# the shape a container deployment actually takes.
#
# To require login, set TRACEBI_AUTH_USER and TRACEBI_AUTH_PASS in a
# local .env file or directly in the environment.
#
# To point the server at your own app module (instead of the bundled
# demo), set TRACEBI_APP to a fully-qualified Python module path that
# imports cleanly inside the container.

x-demo-db-url: &demo-db-url
  # Local development credentials, deliberately weak and not a secret: this
  # database is reachable only from this compose network and your own machine.
  # Override POSTGRES_PASSWORD for anything that outlives a laptop.
  TRACEBI_DEMO_DB_URL: postgresql+psycopg://tracebi:${POSTGRES_PASSWORD:-tracebi}@db:5432/tracebi

services:
  db:
    image: postgres:16-alpine
    container_name: tracebi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracebi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracebi}
      POSTGRES_DB: tracebi
    ports:
      # Published so the execution plane can be driven from the host. Anyone
      # already running Postgres locally has 5432 taken, so this is
      # overridable: POSTGRES_PORT=55432 docker compose up.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The seed service must not start against a Postgres that is still
      # initialising, or the first layer fails on connection refused.
      test: ["CMD-SHELL", "pg_isready -U tracebi -d tracebi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  seed:
    build: .
    image: tracebi:local
    container_name: tracebi-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      TRACEBI_APP: ${TRACEBI_APP:-web.demo_app}
      <<: *demo-db-url
    command:
      - python
      - -c
      - "from web.demo_app.pipeline import seed_and_run; seed_and_run()"
    restart: "no"

  app:
    build: .
    image: tracebi:local
    container_name: tracebi
    restart: unless-stopped
    depends_on:
      # Wait for the data to exist rather than racing it — otherwise the first
      # page load can land on empty tables.
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      # Bundled demo app by default; override to point at your config module.
      TRACEBI_APP: ${TRACEBI_APP:-web.demo_app}
      <<: *demo-db-url
      TRACEBI_REQUESTS_DIR: /app/requests
      TRACEBI_SCHEDULED_DIR: /app/scheduled
      # Optional HTTP basic auth — leave unset to keep the API open.
      TRACEBI_AUTH_USER: ${TRACEBI_AUTH_USER:-}
      TRACEBI_AUTH_PASS: ${TRACEBI_AUTH_PASS:-}
      # Reverse-proxy auth (Authelia / oauth2-proxy / Cloudflare Access).
      # When set, takes precedence over Basic auth.
      TRACEBI_AUTH_PROXY_HEADER: ${TRACEBI_AUTH_PROXY_HEADER:-}
      TRACEBI_AUTH_PROXY_TRUSTED_IPS: ${TRACEBI_AUTH_PROXY_TRUSTED_IPS:-}
      # Set to 1 to enable /api/_dev/reload for hot-reload during dev.
      TRACEBI_DEV_MODE: ${TRACEBI_DEV_MODE:-0}
      PORT: "8000"
    volumes:
      - ./output:/app/output
      - ./requests:/app/requests
      - ./scheduled:/app/scheduled
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
