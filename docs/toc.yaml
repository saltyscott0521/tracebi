# The handbook's order: the one list the docs site, the app's Docs place and
# docs/index.md all read. Sections come in reading order (arriving cold, then
# working, then looking things up); pages within a section in the order a
# reader needs them. Each page is a stem of docs/<section>/<stem>.md. A page
# missing here, or an entry with no page, fails tests/test_docs_site.py by name.
#
# After editing this file or any page, run: python site/build_docs.py
# (it regenerates docs/index.md and site/docs/).

sections:
  - key: start
    title: Start here
    blurb: What TraceBi is and your first report, in an afternoon.
    pages:
      - plain-english
      - quickstart
      - your-first-report
      - demo-script

  - key: concepts
    title: Concepts
    blurb: The ideas, in the order the data moves. Read these once.
    pages:
      - the-three-phase-workflow
      - transform
      - sink-contracts
      - model
      - page: models-and-connectors
        blurb: A model says what the data means; a connector says where it is
      - report
      - trace
      - lineage
      - freeze-points

  - key: guides
    title: Guides
    blurb: Task-shaped walkthroughs, in the order you meet the tasks.
    pages:
      - page: analyst-guide
        blurb: The analyst's path from messy data to a served, verified report
      - notebook-guide
      - styling-a-report
      - one-server
      - sign-in
      - push-from-a-laptop
      - connect-chatgpt-and-claude
      - web-customization
      - page: updating
        blurb: "`tracebi update`: what's new, and the one command that updates your install"

  - key: reference
    title: Reference
    blurb: "Look things up: the project, the data, the model, the report, the server."
    pages:
      - cli
      - tracebi-yaml
      - connections-yaml
      - credentials
      - environment-variables
      - transform-sql
      - model-json
      - measures
      - queries
      - pipeline-yaml
      - report-json
      - page: app-jsx
        blurb: "The React lane: an app-like dashboard from the TraceBi kit, built into the same single offline file"
      - page: template-html
        blurb: "The figure grammar: ordinary HTML, and the `data-tb-*` attributes that turn an element into a live figure"
      - figure-helper
      - number-formats
      - folder-yaml
      - api-routes

  - key: agents
    title: For agents
    blurb: Standard operating procedures. An agent reads AGENTS.md first.
    pages:
      - page: sop-authoring
        blurb: Authoring a report through the gateway, step by step
      - page: sop-model-changes
        blurb: Changing the semantic contract, a model's measures and keys, safely

# An old address → the page that replaced it (<section>/<stem> both sides).
# The app redirects it; the site writes a page there that forwards. An old
# page kept as a stub (receipts) stays in docs/ so old wiki links resolve.
moved:
  concepts/receipts: concepts/trace
  guides/plain-english: start/plain-english
  guides/quickstart: start/quickstart
  guides/your-first-report: start/your-first-report
  guides/demo-script: start/demo-script

# docs/index.md is generated: this intro, one line per page above (its title
# and the first sentence of the page), then this outro.
intro: |
  **Reports as code — to keep agents in line.**

  You build a report the way you build software: the connections, the
  transforms, the star schema, the measures and the figures are all files in your
  repo — reviewed in a pull request, versioned, tested, and authored as easily by
  an agent as by a person.

  > This folder is an [[#Using this vault|Obsidian vault]] — pages link to each
  > other with wiki links, so you can open `docs/` as a vault and navigate the
  > graph. The app serves it as **Docs** (`/docs`), and tracebi.com as `/docs/`,
  > in the order below.

outro: |
  ## The canon

  Short, stable, opinionated documents at the repo root that define the project.

  - `MANIFESTO.md` — what TraceBi is and what it refuses to build
  - `AGENTS.md` — the brief an agent reads before authoring
  - `CLAUDE.md` — behavioural guidelines for AI assistants in this repo

  ---

  ## Using this vault

  Open the `docs/` folder as an Obsidian vault to get backlinks, the graph view,
  and wiki-link autocomplete. Everything is plain Markdown, so it also reads fine
  in an editor or on GitHub — GitHub renders a wiki link as literal text rather
  than a link, which is the one cost of this style.

  **Conventions used throughout:**

  - One page is about **one thing**. If a page needs two headings that could each
    be a page, it becomes two pages.
  - Every page opens with a one-sentence answer to *"what is this?"*
  - Reference pages state what the code accepts, with the refusal it raises when
    you get it wrong — the refusals are part of the contract, not an afterthought.
  - Locked language is quoted exactly: *"the sink satisfied its contract"*,
    *"reproduces"* (never "verified"). See [[trace]] for why the wording is
    load-bearing.
  - The order of pages is `docs/toc.yaml`. A new page goes there, and
    `python site/build_docs.py` regenerates this index and the site.
