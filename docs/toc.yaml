# The handbook's order: the one list the docs site, the app's Docs place and
# docs/index.md all read. Sections come in reading order (arriving cold, then
# working, then looking things up); pages within a section in the order a
# reader needs them. Each page is a stem of docs/<section>/<stem>.md. A page
# missing here, or an entry with no page, fails tests/test_docs_site.py by name.
#
# After editing this file or any page, run: python site/build_docs.py
# (it regenerates docs/index.md and site/docs/).

sections:
  - key: start
    title: Start here
    blurb: Install TraceBi and build your first report.
    pages:
      - plain-english
      - quickstart
      - your-first-report
      - demo-script

  - key: concepts
    title: Concepts
    blurb: How data moves from raw files to a checked report.
    pages:
      - the-three-phase-workflow
      - transform
      - sink-contracts
      - model
      - page: models-and-connectors
        blurb: A model says what the data means; a connector says where it is
      - report
      - trace
      - lineage
      - freeze-points

  - key: guides
    title: Guides
    blurb: Step-by-step instructions for common tasks.
    pages:
      - page: analyst-guide
        blurb: Build a report, check it, send it, and work with a model in Python
      - notebook-guide
      - styling-a-report
      - one-server
      - connect-a-database
      - sign-in
      - push-from-a-laptop
      - connect-chatgpt-and-claude
      - web-customization
      - page: updating
        blurb: Check for a new release and update your install with `tracebi update`

  - key: reference
    title: Reference
    blurb: Every file, key, command and route.
    pages:
      - cli
      - tracebi-yaml
      - connections-yaml
      - credentials
      - environment-variables
      - transform-sql
      - model-json
      - measures
      - queries
      - pipeline-yaml
      - report-json
      - page: app-jsx
        blurb: Build a dashboard from the TraceBi kit in React, into the same single offline file
      - page: template-html
        blurb: Turn ordinary HTML into live figures with `data-tb-*` attributes
      - figure-helper
      - number-formats
      - folder-yaml
      - api-routes

  - key: agents
    title: For agents
    blurb: Procedures for AI agents. An agent reads AGENTS.md first.
    pages:
      - page: sop-authoring
        blurb: Author a report through the gateway, step by step
      - page: sop-model-changes
        blurb: Change a model's measures and keys safely

# An old address → the page that replaced it (<section>/<stem> both sides).
# The app redirects it; the site writes a page there that forwards. An old
# page kept as a stub (receipts) stays in docs/ so old wiki links resolve.
moved:
  concepts/receipts: concepts/trace
  guides/plain-english: start/plain-english
  guides/quickstart: start/quickstart
  guides/your-first-report: start/your-first-report
  guides/demo-script: start/demo-script

# docs/index.md is generated: this intro, one line per page above (its title
# and the first sentence of the page), then this outro.
intro: |
  **Reports as code, with a trace behind every number.**

  You build a report the way you build software. The connections, transforms,
  star schema, measures and figures are files in your repository: reviewed in
  a pull request, versioned, tested, and written as easily by an agent as by a
  person.

  > This folder is an [[#Using this vault|Obsidian vault]]. Pages link to each
  > other with wiki links, so you can open `docs/` as a vault and browse the
  > graph. The app serves it as **Docs** (`/docs`), and tracebi.com as
  > `/docs/`, in the order below.

outro: |
  ## The canon

  Short, stable documents at the repository root that define the project.

  - `MANIFESTO.md`: what TraceBi is and what it will not build
  - `AGENTS.md`: the brief an agent reads before authoring
  - `CLAUDE.md`: guidelines for AI assistants working in this repository

  ---

  ## Using this vault

  Open the `docs/` folder as an Obsidian vault for backlinks, the graph view
  and wiki-link autocomplete. Everything is plain Markdown, so it also reads in
  an editor or on GitHub, where a wiki link shows as plain text.

  **Conventions:**

  - Each page is about one thing.
  - Each page opens with one sentence saying what you will do or get.
  - Reference pages list what the code accepts, and the refusal it gives when
    you get it wrong.
  - Some phrases are fixed because the product uses them exactly: *"the sink
    satisfied its contract"* and *"reproduces"* (never "verified"). See
    [[trace]].
  - The order of pages is `docs/toc.yaml`. Add a new page there, then run
    `python site/build_docs.py` to regenerate this index and the site.
