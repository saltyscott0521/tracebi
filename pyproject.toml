[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracebi"
version = "0.5.2"
description = "Code-first, traceable BI and analytics framework for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "TraceBi contributors" },
]
keywords = [
    "bi",
    "business-intelligence",
    "analytics",
    "lineage",
    "etl",
    "medallion",
    "reports",
    "data-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.5",
]

[project.urls]
Homepage      = "https://github.com/saltyscott0521/tracebi"
Repository    = "https://github.com/saltyscott0521/tracebi"
Documentation = "https://github.com/saltyscott0521/tracebi#readme"
Issues        = "https://github.com/saltyscott0521/tracebi/issues"
Changelog     = "https://github.com/saltyscott0521/tracebi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
csv       = ["openpyxl>=3.0"]
sql       = ["sqlalchemy>=2.0"]
# `sql` brings SQLAlchemy but no driver, so Postgres — the database every
# deployment doc here assumes — needed one naming. api/requirements.txt had
# been hand-rolling psycopg for exactly this reason.
postgres  = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
duckdb    = ["duckdb>=0.9"]
bigquery  = ["google-cloud-bigquery>=3.0", "db-dtypes"]
snowflake = ["snowflake-connector-python>=3.0"]
reports   = ["openpyxl>=3.0", "matplotlib>=3.5"]
pdf       = ["weasyprint>=57"]  # enables HTMLRenderer.render_pdf(); no standalone PDFRenderer yet
lineage   = ["networkx>=3.0", "matplotlib>=3.5"]
medallion = ["networkx>=3.0"]
pipeline  = ["apscheduler>=3.10", "sqlalchemy>=2.0"]
web       = ["fastapi>=0.100", "uvicorn>=0.23", "starlette>=0.27", "jinja2>=3.0", "python-multipart>=0.0.6"]
mcp       = ["mcp>=2.0"]  # the agent gateway — `tracebi mcp`

# Convenience bundles
analyst = [
    # Common case for a data analyst: reports + SQL + CSV + lineage + DuckDB + dotenv
    "openpyxl>=3.0",
    "matplotlib>=3.5",
    "sqlalchemy>=2.0",
    "networkx>=3.0",
    "duckdb>=0.9",
    "python-dotenv>=1.0",
]
all = [
    # Everything: every connector, every renderer, every server.
    "openpyxl>=3.0",
    "matplotlib>=3.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "duckdb>=0.9",
    "google-cloud-bigquery>=3.0",
    "db-dtypes",
    "snowflake-connector-python>=3.0",
    "weasyprint>=57",
    "networkx>=3.0",
    "apscheduler>=3.10",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "starlette>=0.27",
    "jinja2>=3.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
    "mcp>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.4",
    # mcp so CI actually exercises the gateway registration + auth tests
    # instead of importorskip-ing them.
    "mcp>=2.0",
    "openpyxl>=3.0",
    "matplotlib>=3.5",
    "networkx>=3.0",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "duckdb>=0.9",
    "python-dotenv>=1.0",
    # Web deps included so `pip install -e ".[dev]"` runs the full test suite
    # (tests/test_phase5.py exercises the FastAPI layer).
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "starlette>=0.27",
    "jinja2>=3.0",
    "python-multipart>=0.0.6",
    # NOT a typo for httpx: starlette >=1.x TestClient prefers `import httpx2`
    # (the Pydantic-maintained httpx successor) and falls back to httpx.
    "httpx2",
]

[project.scripts]
tracebi = "tracebi.cli:main"

[tool.hatch.build.targets.wheel]
# One package, and it is `tracebi`. Before the move the wheel shipped the
# library but *not* the FastAPI app, so an installed TraceBi had no server at
# all — `tracebi serve` could never work. The obvious fix, adding a top-level
# `web` to this list, would have installed a directory named `web/` into
# site-packages: the same path the unrelated `web.py` distribution on PyPI
# owns. pip overwrites whichever is installed second and reports nothing, so
# the loser breaks. Hence tracebi.web.api — the app ships, nothing top-level
# does, and both distributions coexist.
packages = ["tracebi"]
# `packages` alone is not enough: hatchling's file selection honours
# .gitignore, and tracebi/web/ui/dist is gitignored — so the wheel would ship
# the FastAPI app with no built UI and serve a 404 homepage. Run
# `cd web/ui && npm ci && npm run build` before building a wheel (vite's
# build.outDir writes into the package); CI asserts
# tracebi/web/ui/dist/index.html is inside it.
artifacts = ["tracebi/web/ui/dist/**"]
# The Node workspace itself (web/ui/src, package.json, the lockfile) stays at
# the repo root and is deliberately not packaged: it is a build input, not a
# runtime one, and the no-bundle page points a checkout at it by path.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the lint surface narrow — just pyflakes (real bugs). The codebase
# predates ruff so we don't enable import-order / whitespace rules that
# would churn unrelated files.
select = ["F"]
ignore = [
    "F541",  # f-string without placeholders — used intentionally for clarity
    "F841",  # unused local — a few pre-existing cases, not worth churning
]

[tool.ruff.lint.per-file-ignores]
"tests/*"    = ["F401", "F811", "F841"]   # fixtures + intentional re-imports
"examples/*" = ["F401"]
# These modules use `try: import optional_dep` blocks as availability checks;
# ruff F401 misreads them as unused imports.
"tracebi/reports/excel_renderer.py" = ["F401"]
"tracebi/reports/html_renderer.py"  = ["F401"]
