name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Run tests
        run: pytest tests/ -q

  base-install:
    name: base install (no extras)
    runs-on: ubuntu-latest
    # The test job installs ".[dev,web]", so it cannot catch a module-level
    # import of an optional dependency. That is exactly how `import tracebi`
    # came to hard-require networkx while the only declared runtime dep is
    # pandas. This job installs the base distribution and nothing else.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base distribution only
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Import on base dependencies
        run: |
          python -c "import tracebi"
          python -c "import tracebi.cli"
          python -c "import tracebi.model"
          python -c "import tracebi.reports"
          python -c "import tracebi.model_registry, tracebi.pipeline_registry"

      - name: Console script works
        run: tracebi --version

      - name: Optional deps are genuinely absent
        # Guards the guard: if an extra leaks into the base install this job
        # would pass vacuously.
        run: |
          python - <<'PY'
          import importlib.util as u
          leaked = [m for m in ("networkx", "matplotlib", "sqlalchemy", "duckdb", "dash", "fastapi")
                    if u.find_spec(m) is not None]
          assert not leaked, f"optional deps leaked into base install: {leaked}"
          print("base install is clean")
          PY

  wheel:
    name: wheel ships the built UI
    runs-on: ubuntu-latest
    # tracebi/web/ui/dist is gitignored, so a wheel cut from a clean tree ships
    # the FastAPI app with no bundle and serves the "UI not built" page instead
    # of the app. Build the UI, build the wheel, assert the bundle is inside it
    # — and that the wheel still ships nothing at the top level named web/.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build the UI
        run: npm ci && npm run build
        working-directory: web/ui

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Wheel contains the built UI and the web app
        run: |
          python - <<'PY'
          import glob, zipfile
          whl, = glob.glob("dist/*.whl")
          names = set(zipfile.ZipFile(whl).namelist())
          for required in ("tracebi/web/api/main.py", "tracebi/web/ui/dist/index.html"):
              assert required in names, f"{required} missing from {whl}"
          # `web.py` on PyPI owns a top-level `web/` in site-packages. Shipping
          # one here means pip silently overwrites whichever is installed
          # second, so nothing top-level may leave this wheel.
          top = {n.split("/")[0] for n in names}
          assert "web" not in top, f"{whl} ships a top-level web/ again: {sorted(top)}"
          print(f"{whl} ships the web app and the built UI, and nothing top-level named web/")
          PY

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Lint
        run: ruff check tracebi/ tests/ api/

  security:
    name: pip-audit
    runs-on: ubuntu-latest
    # Complements Dependabot alerts: scans the resolved dependency tree for
    # known CVEs. Informational for now (continue-on-error) so a transient
    # advisory in a transitive dep does not block unrelated PRs; promote to
    # blocking once the tree is clean.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]" pip-audit

      - name: Audit dependencies for known vulnerabilities
        continue-on-error: true
        run: pip-audit --desc
