# Pipeline for saas_model: rebuild the warehouse, then its reports.
#
#     transform  runs transforms/saas_transform.sql: cleans inputs/subscriptions.csv,
#                sinks the star schema into data/warehouse.duckdb, then checks
#                saas_transform.contract.yaml
#     build      builds every report in reports/saas_model/, each with its trace
#
#     tracebi run-pipeline saas_model
name: saas_model
description: Rebuild the SaaS warehouse, then its reports.
transform: saas_transform
models: [saas_model]
reports: all
schedule: null
