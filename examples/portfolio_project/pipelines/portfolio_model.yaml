# Pipeline for portfolio_model: rebuild the warehouse, then its reports.
#
#     transform  runs transforms/holdings_transform.sql: cleans inputs/holdings.csv,
#                sinks the star schema into data/warehouse.duckdb, then checks
#                holdings_transform.contract.yaml
#     build      builds every report in reports/portfolio_model/, each with its trace
#
#     tracebi run-pipeline portfolio_model
name: portfolio_model
description: Rebuild the portfolio warehouse, then its reports.
transform: holdings_transform
models: [portfolio_model]
reports: all
schedule: null
