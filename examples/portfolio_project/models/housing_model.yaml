# Phase 2: MODEL: housing affordability, the two-part test.
#
# Three facts over shared dimensions:
#
# * fact_housing: one row per year: rate, prices, incomes, and what the
#   median existing home took to get into (entry_cost) and to carry
#   (payment: principal, interest, property tax, insurance).
# * fact_cohort_path: one row per buyer per year owned (up to ten): what
#   that year's buyer was paying, after any refinance, against that later
#   year's income. dim_cohort.purchase_year is the purchase year and
#   dim_held.years_owned how long they had owned it.
# * fact_ten_year: one row per buyer: cash to close plus ten years of
#   payments, and ten years of income. dim_cohort.basis is `projected`
#   when any of those years lies past the data.
#
# Across several years the plain measures are simple means; every share is a
# ratio of totals, so a multi-year share is never a mean of shares.
#
#     from tracebi.model_registry import get_model
#     model = get_model("housing_model")

name: housing_model

# connectors: where the tables live (a DuckDB file inside the project)
connectors:
  - name: housing_warehouse
    type: duckdb
    database: data/housing.duckdb

# tables: each table the phase-1 transform sank, by its warehouse name
tables:
  - name: fact_housing
    connector: housing_warehouse
    source: fact_housing
  - name: fact_cohort_path
    connector: housing_warehouse
    source: fact_cohort_path
  - name: fact_ten_year
    connector: housing_warehouse
    source: fact_ten_year
  - name: dim_year
    connector: housing_warehouse
    source: dim_year
  - name: dim_cohort
    connector: housing_warehouse
    source: dim_cohort
  - name: dim_held
    connector: housing_warehouse
    source: dim_held

# dimensions: the descriptive tables (key column, attributes to slice by)
dimensions:
  - name: dim_year
    table: dim_year
    key: year_id
    attributes: [year, decade]
  - name: dim_cohort
    table: dim_cohort
    key: cohort_id
    attributes: [purchase_year, basis]
  - name: dim_held
    table: dim_held
    key: held_id
    attributes: [years_owned]

# facts: the event tables (numeric columns, key to each dimension)
facts:
  - name: fact_housing
    table: fact_housing
    measures: [mortgage_rate, existing_price, new_home_price, median_income, earner_income, payment, entry_cost]
    foreign_keys:
      dim_year: year_id
  - name: fact_cohort_path
    table: fact_cohort_path
    measures: [annual_payment, outlay, median_income, rate_held]
    foreign_keys:
      dim_year: year_id
      dim_cohort: cohort_id
      dim_held: held_id
  - name: fact_ten_year
    table: fact_ten_year
    measures: [outlay, median_income, years_measured, rate_at_purchase, price_at_purchase, income_at_purchase,
      assumed_rate, growth_pct]
    foreign_keys:
      dim_cohort: cohort_id

# measures: the named vocabulary reports ask for
measures:
  # One row per year, so per year this is that year's published average.
  # Across years it is a plain mean of annual averages: there is no loan
  # volume here to weight by. Hence allow_rate_agg.
  - name: mortgage_rate
    column: mortgage_rate
    agg: mean
    description: 30-year fixed rate, annual average, in percent
    format: decimal
    allow_rate_agg: true
  - name: existing_price
    column: existing_price
    agg: mean
    description: Median existing-home price (FHFA repeat-sales index scaled to NAR's median)
    format: currency0
  - name: new_home_price
    column: new_home_price
    agg: mean
    description: Census/HUD median price of houses sold, mostly new
    format: currency0
  - name: median_income
    column: median_income
    agg: mean
    description: Median household income
    format: currency0
  - name: earner_income
    column: earner_income
    agg: mean
    description: Median full-time earner's pay (weekly x 52)
    format: currency0
  - name: payment
    column: payment
    agg: mean
    description: Monthly principal, interest, property tax and insurance on the median existing home,
      20% down
    format: currency0
  - name: entry_cost
    column: entry_cost
    agg: mean
    description: 'Cash to close: 20% down plus 3% closing costs'
    format: currency0
  - name: annual_payment_total
    column: annual_payment
    agg: sum
    description: Twelve monthly payments
  - name: annual_pi_total
    column: annual_pi
    agg: sum
    description: Twelve months of principal and interest only
  - name: entry_total
    column: entry_cost
    agg: sum
    description: Cash to close, summed
  - name: income_total
    column: median_income
    agg: sum
    description: Median household income, summed
  - name: earner_total
    column: earner_income
    agg: sum
    description: Full-time earner's pay, summed
  - name: price_total
    column: existing_price
    agg: sum
    description: Existing-home price, summed
  - name: payment_share
    ratio: [annual_payment_total, income_total]
    description: A year of full payments as a share of median household income
    format: percent
  - name: pi_share
    ratio: [annual_pi_total, income_total]
    description: 'Principal and interest only, as a share of income: the narrow measure'
    format: percent
  - name: earner_share
    ratio: [annual_payment_total, earner_total]
    description: A year of full payments as a share of one full-time earner's pay
    format: percent
  - name: entry_share
    ratio: [entry_total, income_total]
    description: Cash to close as a share of a year's median household income
    format: percent
  - name: price_to_income
    ratio: [price_total, income_total]
    description: Existing-home price as a multiple of median household income
    format: decimal
  # On fact_cohort_path the same payment_share reads a buyer's payment in a
  # later year against THAT year's income, so rising incomes and refinances
  # both show.
  # The one number: cash to close plus ten years of payments, over the
  # income earned in those ten years. On fact_ten_year, one row per buyer;
  # dim_cohort.basis says whether any of the ten years is projected.
  - name: outlay_total
    column: outlay
    agg: sum
    description: Cash to close plus payments, summed
  - name: housing_share
    ratio: [outlay_total, income_total]
    description: Cash to close plus every payment, as a share of the household income earned over the
      same years
    format: percent
  - name: years_measured
    column: years_measured
    agg: min
    description: How many of a buyer's ten years are in the data; the rest are projected
  # What the projection box on the report starts from (fact_ten_year).
  - name: rate_at_purchase
    column: rate_at_purchase
    agg: mean
    description: Rate at purchase
    format: decimal
    allow_rate_agg: true
  - name: price_at_purchase
    column: price_at_purchase
    agg: mean
    description: Existing-home price at purchase
    format: currency0
  - name: income_at_purchase
    column: income_at_purchase
    agg: mean
    description: Median household income at purchase
    format: currency0
  - name: assumed_rate
    column: assumed_rate
    agg: mean
    description: 'Rate assumed for projected years: the last year''s average'
    format: decimal
    allow_rate_agg: true
  - name: growth_pct
    column: growth_pct
    agg: mean
    description: 'Yearly income and home-value growth assumed for projected years: income''s last-decade
      pace, in percent'
    format: decimal
    allow_rate_agg: true
  - name: rate_held
    column: rate_held
    agg: mean
    description: The rate the buyer holds that year, after any refinance
    format: decimal
    allow_rate_agg: true
