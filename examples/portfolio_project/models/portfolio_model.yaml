# Phase 2: MODEL.
#
# A star schema over the warehouse phase 1 sank into. This file is the
# *contract*: it names the grain, the keys, and the measures, in a few dozen
# declarative lines a reviewer can read without ever opening the pandas that
# produced the tables. It reads the warehouse; it does not build it.
#
#     from tracebi.model_registry import get_model
#     model = get_model("portfolio_model")
#
# Discovery loads this file without touching the warehouse; a query is what
# reads it.

name: portfolio_model

# connectors: where the tables live (a DuckDB file inside the project)
connectors:
  - name: warehouse
    type: duckdb
    database: data/warehouse.duckdb

# tables: each table the phase-1 transform sank, by its warehouse name
tables:
  - name: fact_holdings
    connector: warehouse
    source: fact_holdings
  - name: dim_fund
    connector: warehouse
    source: dim_fund
  - name: dim_issuer
    connector: warehouse
    source: dim_issuer

# dimensions: the descriptive tables (key column, attributes to slice by)
dimensions:
  - name: dim_fund
    table: dim_fund
    key: fund_id
    attributes: [fund]
  - name: dim_issuer
    table: dim_issuer
    key: issuer_id
    attributes: [issuer, sector]

# facts: the event tables (numeric columns, key to each dimension)
facts:
  - name: fact_holdings
    table: fact_holdings
    measures: [par, cost, fair_value, spread_bps]
    foreign_keys:
      dim_fund: fund_id
      dim_issuer: issuer_id

# measures: the named vocabulary reports ask for
measures:
  - name: fair_value
    column: fair_value
    agg: sum
    description: Total fair value
    format: currency0
  - name: cost_basis
    column: cost
    agg: sum
    description: Total cost basis
    format: currency0
  - name: par_amount
    column: par
    agg: sum
    description: Total par
    format: currency0
  - name: positions
    column: holding_id
    agg: count
    description: Position count
  - name: unrealized
    agg: sum
    expr: fair_value - cost
    description: Unrealized gain / loss
    format: currency0
  # A par-weighted spread is a ratio of totals, not a plain mean: a $1M and a
  # $1k position must NOT count equally. See `tracebi knowledge
  # weighted-vs-plain-mean`. (This measure previously declared agg=mean and
  # called it "weighted": the exact silent-wrong trap the lesson warns about.)
  - name: spread_x_par
    agg: sum
    expr: spread_bps * par
    description: Σ(spread × par) — par-weighted-spread numerator
  - name: wtd_spread_bps
    ratio: [spread_x_par, par_amount]
    description: Par-weighted average spread (bps)
  - name: mark
    ratio: [fair_value, cost_basis]
    description: Fair value / cost
    format: percent
  # Concentration window measures: rank, % of total, and cumulative %. These
  # used to live in reports/portfolio_model/portfolio_concentration/report.py
  # (ungoverned, verifiable:false); as governed measures every number is
  # query-reproducible and `verify` reads green. See `tracebi knowledge
  # rank-and-cumulative`.
  - name: fv_rank
    rank: fair_value
    description: Rank by fair value (1 = largest)
  - name: fv_share
    share: fair_value
    description: Fair value as % of total
    format: percent
  - name: fv_cum_share
    running: fv_share
    description: Cumulative % of total (largest first)
    format: percent
  # Top-N-per-group: rank within each sector, not globally. Query with
  # dimensions=[dim_issuer.sector, dim_issuer.issuer] and
  # having={"fv_rank_in_sector": {"lte": 3}} for the top 3 issuers per sector,
  # governed. See `tracebi knowledge rank-and-cumulative`.
  - name: fv_rank_in_sector
    rank: fair_value
    partition_by: [dim_issuer.sector]
    description: Rank by fair value within each sector (1 = largest)
  # Tail risk: the 90th-percentile spread is the widest 10% of marks, which a
  # weighted average (wtd_spread_bps) hides. p<N> is any percentile; p50 is the
  # median. See `tracebi knowledge summarize-a-distribution`.
  - name: spread_p90
    column: spread_bps
    agg: p90
    description: 90th-percentile spread (bps) — the wide tail
