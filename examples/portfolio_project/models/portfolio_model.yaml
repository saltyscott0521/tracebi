# Phase 2: MODEL.
#
# A star schema over the warehouse phase 1 sank into. This file is the
# *contract*: it names the grain, the keys, and the measures, in a few dozen
# declarative lines a reviewer can read without ever opening the pandas that
# produced the tables. It reads the warehouse; it does not build it.
#
#     from tracebi.model_registry import get_model
#     model = get_model("portfolio_model")
#
# Discovery loads this file without touching the warehouse; a query is what
# reads it.

name: portfolio_model
label: Direct Lending Portfolio

# The semantic layer's words: what the model is about, other names for it,
# and questions it answers. Ask offers the questions as starting chips and an
# agent receives all of it (get_context --model); nothing computes from them.
description: >-
  A direct-lending book: every loan position each fund holds in an issuer,
  marked at fair value, with its credit rating and the cash that flowed in
  and out of it.
synonyms: [loan book, credit portfolio]
questions:
  - Which sectors hold the most fair value?
  - What is the par-weighted spread by rating?
  - Which issuers carry the largest unrealized gain?

# connectors: where the tables live. `type: warehouse` is the project's
# warehouse, wherever tracebi.yaml puts it (data/warehouse.duckdb by default;
# Parquet on object storage, or a remote engine, by changing that one file).
connectors:
  - name: warehouse
    type: warehouse

# tables: each table the phase-1 transform sank, by its warehouse name
tables:
  - name: fact_holdings
    connector: warehouse
    source: fact_holdings
  - name: dim_fund
    connector: warehouse
    source: dim_fund
  - name: dim_issuer
    connector: warehouse
    source: dim_issuer
  # Sunk from the CRM (a Postgres source the transform reads through its
  # `-- source:` line); here it is a warehouse table like any other.
  - name: dim_rating
    connector: warehouse
    source: dim_rating
  - name: fact_cashflows
    connector: warehouse
    source: fact_cashflows
  - name: dim_date
    connector: warehouse
    source: dim_date
  - name: dim_flow_type
    connector: warehouse
    source: dim_flow_type
  # A sink view (holdings_transform.sql), not a copy of rows: the model reads
  # it as it reads a table, and it always agrees with the two tables it names.
  - name: fact_holdings_by_sector
    connector: warehouse
    source: fact_holdings_by_sector

# dimensions: the descriptive tables (key column, attributes to slice by)
dimensions:
  # An attribute is a column name, or an object when it needs words for
  # people and agents (a label, a description, synonyms); queries still name
  # it dim.attribute either way.
  - name: dim_fund
    table: dim_fund
    key: fund_id
    description: The fund that holds the position
    synonyms: [vehicle]
    attributes: [fund]
  - name: dim_issuer
    table: dim_issuer
    key: issuer_id
    description: The borrower a loan is made to, and its industry
    synonyms: [borrower, company, obligor]
    attributes:
      - issuer
      - name: sector
        description: The issuer's industry
        synonyms: [industry]
  - name: dim_rating
    table: dim_rating
    key: rating_id
    description: The issuer's rating in the CRM (Unrated when the CRM does not cover it) and its watch status
    attributes:
      - name: rating
        description: The credit rating the CRM records
        synonyms: [credit rating, grade]
      - name: watch
        description: Whether the credit team has it on watch (yes, no, or unknown)
        synonyms: [watchlist]
  - name: dim_date
    table: dim_date
    key: flow_date
    description: The date a cash flow settled
    attributes: [flow_date]
  - name: dim_flow_type
    table: dim_flow_type
    key: flow_type_id
    description: What a cash flow was (a drawdown, interest, or a repayment)
    attributes: [flow_type]
  # The view's own grain: one row per sector, so the sector is its key.
  - name: dim_book
    table: fact_holdings_by_sector
    key: sector
    description: The book by sector, as the sink view groups it (one row per sector)
    attributes: [sector]

# time_grains: a date attribute rolled up to a period, groupable like any
# attribute (dim_date.month reads "2025-03")
time_grains:
  - dimension: dim_date
    name: month
    source: flow_date
    grain: month

# facts: the event tables (numeric columns, key to each dimension)
facts:
  - name: fact_holdings
    table: fact_holdings
    measures: [par, cost, fair_value, spread_bps]
    foreign_keys:
      dim_fund: fund_id
      dim_issuer: issuer_id
      dim_rating: rating_id
  # A second fact over the same funds and issuers: one page can show both,
  # and a filter on a dimension only one of them reaches (the flow's type or
  # date) leaves the other's figures as they are, saying so.
  - name: fact_cashflows
    table: fact_cashflows
    measures: [amount]
    foreign_keys:
      dim_fund: fund_id
      dim_issuer: issuer_id
      dim_date: flow_date
      dim_flow_type: flow_type_id
  # The book by sector, read from the warehouse's sink view: the same fair
  # value fact_holdings gives by dim_issuer.sector, plus a count of issuers.
  - name: fact_holdings_by_sector
    table: fact_holdings_by_sector
    measures: [issuers, positions, fair_value]
    foreign_keys:
      dim_book: sector

# measures: the named vocabulary reports ask for
measures:
  - name: fair_value
    column: fair_value
    agg: sum
    description: Total fair value
    synonyms: [market value, FV, mark-to-market value]
    format: currency0
  - name: cost_basis
    column: cost
    agg: sum
    description: Total cost basis
    synonyms: [cost, book cost]
    format: currency0
  - name: par_amount
    column: par
    agg: sum
    description: Total par
    synonyms: [par, face value, principal]
    format: currency0
  - name: positions
    column: holding_id
    agg: count
    description: Position count
    synonyms: [holdings, loans]
  - name: unrealized
    agg: sum
    expr: fair_value - cost
    description: Unrealized gain / loss
    synonyms: [unrealized gain, unrealized P&L]
    format: currency0
  # A par-weighted spread is a ratio of totals, not a plain mean: a $1M and a
  # $1k position must NOT count equally. See `tracebi knowledge
  # weighted-vs-plain-mean`. (This measure previously declared agg=mean and
  # called it "weighted": the exact silent-wrong trap the lesson warns about.)
  - name: spread_x_par
    agg: sum
    expr: spread_bps * par
    description: Σ(spread × par) — par-weighted-spread numerator
  - name: wtd_spread_bps
    ratio: [spread_x_par, par_amount]
    description: Par-weighted average spread (bps)
    synonyms: [par-weighted spread, weighted spread, spread]
    format: decimal
  - name: mark
    ratio: [fair_value, cost_basis]
    description: Fair value / cost
    synonyms: [price, mark to cost]
    format: percent
  # Concentration window measures: rank, % of total, and cumulative %. These
  # used to live in reports/portfolio_model/portfolio_concentration/report.py
  # (ungoverned, verifiable:false); as governed measures every number is
  # query-reproducible and `verify` reads green. See `tracebi knowledge
  # rank-and-cumulative`.
  - name: fv_rank
    rank: fair_value
    description: Rank by fair value (1 = largest)
  - name: fv_share
    share: fair_value
    label: Share of fair value
    description: Fair value as % of total
    synonyms: [concentration, share of the book]
    format: percent
  - name: fv_cum_share
    running: fv_share
    description: Cumulative % of total (largest first)
    format: percent
  # Top-N-per-group: rank within each sector, not globally. Query with
  # dimensions=[dim_issuer.sector, dim_issuer.issuer] and
  # having={"fv_rank_in_sector": {"lte": 3}} for the top 3 issuers per sector,
  # governed. See `tracebi knowledge rank-and-cumulative`.
  - name: fv_rank_in_sector
    rank: fair_value
    partition_by: [dim_issuer.sector]
    description: Rank by fair value within each sector (1 = largest)
  # Tail risk: the 90th-percentile spread is the widest 10% of marks, which a
  # weighted average (wtd_spread_bps) hides. p<N> is any percentile; p50 is the
  # median. See `tracebi knowledge summarize-a-distribution`.
  - name: spread_p90
    column: spread_bps
    agg: p90
    description: 90th-percentile spread (bps) — the wide tail
  - name: net_flow
    column: amount
    agg: sum
    description: Net cash flow (received less lent out)
    synonyms: [net cash flow, cash flow]
    format: currency0
  - name: flow_count
    column: cashflow_id
    agg: count
    description: Number of cash flows
  - name: sector_issuers
    column: issuers
    agg: sum
    description: Issuers in the sector (the book-by-sector view)
    synonyms: [borrowers per sector]
