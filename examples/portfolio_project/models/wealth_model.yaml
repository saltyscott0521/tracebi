# Phase 2: MODEL. Wealth Management.
#
# A star schema over the warehouse phase 1 sank from the core-banking system
# (transforms/wealth_transform.sql, reading connections/bank.yaml). Two facts
# share four dimensions: positions (fact_holdings, a current snapshot, one row
# per holding) and account activity (fact_activities, one row per purchase,
# sale or fee over the last twelve months). Each fact carries its account's
# client and that client's branch, so both slice by client, branch, product
# and account directly.
#
# Assets under management is the sum of position market values; gain on cost
# is a ratio of totals, not a mean of per-position returns.
#
#     from tracebi.model_registry import get_model
#     model = get_model("wealth_model")

name: wealth_model
label: Wealth Management

# connectors: where the tables live: the project's warehouse (tracebi.yaml)
connectors:
  - name: warehouse
    type: warehouse

# tables: each table the phase-1 transform sank, by its warehouse name
tables:
  - name: wealth_fact_holdings
    connector: warehouse
    source: wealth_fact_holdings
  - name: wealth_fact_activities
    connector: warehouse
    source: wealth_fact_activities
  - name: wealth_dim_client
    connector: warehouse
    source: wealth_dim_client
  - name: wealth_dim_branch
    connector: warehouse
    source: wealth_dim_branch
  - name: wealth_dim_product
    connector: warehouse
    source: wealth_dim_product
  - name: wealth_dim_account
    connector: warehouse
    source: wealth_dim_account

# dimensions: the descriptive tables (key column, attributes to slice by)
dimensions:
  - name: dim_client
    table: wealth_dim_client
    key: client_id
    attributes: [name, segment, risk_profile, advisor]
  - name: dim_branch
    table: wealth_dim_branch
    key: branch_id
    attributes: [branch, region, manager]
  - name: dim_product
    table: wealth_dim_product
    key: product_id
    attributes: [ticker, product_name, asset_class, risk_rating]
  - name: dim_account
    table: wealth_dim_account
    key: account_id
    attributes: [account_type, opened]

# facts: the event tables (numeric columns, key to each dimension)
facts:
  - name: fact_holdings
    table: wealth_fact_holdings
    measures: [units, market_value, cost_basis]
    foreign_keys:
      dim_account: account_id
      dim_client: client_id
      dim_branch: branch_id
      dim_product: product_id
  - name: fact_activities
    table: wealth_fact_activities
    measures: [units, amount]
    foreign_keys:
      dim_account: account_id
      dim_client: client_id
      dim_branch: branch_id
      dim_product: product_id

# measures: the named vocabulary reports ask for
measures:
  - name: market_value
    column: market_value
    agg: sum
    description: Assets under management, the sum of position market values
    format: currency0
  - name: cost_basis
    column: cost_basis
    agg: sum
    description: Sum of position cost bases
    format: currency0
  - name: unrealized_gain
    expr: market_value - cost_basis
    agg: sum
    description: Market value less cost basis, summed per group
    format: currency0
  - name: gain_pct
    ratio: [unrealized_gain, cost_basis]
    description: Unrealized gain as a share of cost basis (ratio of totals)
    format: percent
  - name: clients
    column: client_id
    agg: nunique
    description: Distinct clients in the rows queried
    format: comma
  - name: activity_volume
    column: amount
    agg: sum
    description: Sum of activity amounts (purchases, sales and fees)
    format: currency0
